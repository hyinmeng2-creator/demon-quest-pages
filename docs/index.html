<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Demon Quest</title>
  <style>
    :root{font:16px/1.5 system-ui,-apple-system,sans-serif;color:#19364b;background:#f5f7f6}
    body{margin:0}
    header{background:#18364e;color:white;padding:18px max(20px,calc((100% - 1100px)/2));font-weight:800;font-size:1.2rem}
    main{max-width:1100px;margin:auto;padding:48px 20px}
    h1{font-size:2rem;line-height:1.2;margin:0 0 24px}
    .modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .modules a{display:block;background:white;border:1px solid #c7d9d7;border-top:4px solid #007f86;border-radius:5px;padding:22px;text-decoration:none;color:#19364b}
    .modules a:hover{background:#eaf6f3}
    .modules strong{display:block;font-size:1.2rem}
    .modules span{display:block;color:#607984;margin-top:5px}
    a:focus-visible{outline:3px solid #d89d31;outline-offset:3px}
    @media(max-width:600px){.modules{grid-template-columns:1fr}main{padding:32px 16px}}
  </style>
</head>
<body><header>Demon Quest /11</header><main><h1>Choose a quest</h1><div class="modules"><a href="grammar/"><strong>Grammar Quest</strong><span>Practice forms and sentence patterns</span></a><a href="vocabulary/"><strong>Vocabulary Quest</strong><span>Choose words that fit the meaning</span></a></div></main></body>
</html>
